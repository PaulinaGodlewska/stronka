<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paulina Godlewska - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Reset i podstawowe style */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f7ff; /* Bardzo jasny błękit */
            color: #1a365d; /* Ciemny granat dla czytelności */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            line-height: 1.6;
        }

        /* Kontener główny */
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        /* Imię i nazwisko */
        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -1px;
            margin-bottom: 1.5rem;
            color: #2b6cb0; /* Klasyczny niebieski */
        }

        /* Linia dekoracyjna */
        .divider {
            width: 50px;
            height: 3px;
            background-color: #63b3ed; /* Jasny błękit */
            margin: 0 auto 2rem;
            border-radius: 2px;
        }

        /* Cytat */
        .quote {
            font-size: 1.25rem;
            font-weight: 300;
            font-style: italic;
            color: #4a5568;
            margin-bottom: 2.5rem;
        }

        /* Przycisk (Call to Action) */
        .cta-button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #2b6cb0;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 400;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(43, 108, 176, 0.2);
        }

        .cta-button:hover {
            background-color: #2c5282;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(43, 108, 176, 0.3);
        }

        /* Animacja wejścia */
        .fade-in {
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container fade-in">
        <h1>Paulina Godlewska</h1>
        <div class="divider"></div>
        <p class="quote">
            "Twoja wizja zasługuje na najlepszą formę. <br>
            Zmieńmy wspólnie pomysły w rzeczywistość, która zachwyca."
        </p>
        <a href="mailto:kontakt@przyklad.pl" class="cta-button">Zacznijmy współpracę</a>
    </div>

</body>
</html>
